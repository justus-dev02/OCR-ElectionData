# Document profile bound by SHA-256 to data/010_2611_49001.pdf. Domain data, NOT code.
# keyword_min_similarity 0.6: the bold typewriter font of this volume is read poorly ('Kreis' -> 'KrelB');
# only affects structure keywords (needs >=2 agreeing engines, names are still matched exactly).
document_profile_id: bw_btw1949_gemeinden
description: Die Wahl zum ersten Bundestag der Bundesrepublik Deutschland am 14. August 1949 - Gemeindeergebnisse (Statistik von Baden-Wuerttemberg,
  Band 10)
sha256:
- 5797b07d8edaa2d096d47bac00ee0377b5ab602e5ce04bab0275441c011281b6
verified: false
sources:
- 'data/010_2611_49001.pdf pages 10-89: column headers and ''Reg.Bez.'' page captions (visual inspection)'
tables:
