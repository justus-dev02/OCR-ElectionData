  election_id: btw_1949
  description: One line per municipality; 'Kreis X' lines carry the county totals on the same line.
  row_mode: single_line
  line_anchor_column: eligible_voters
  single_line_vote_type: SINGLE
  label_pattern: ^(?P<index>\d+)\s+(?P<name>\S.*)$
  section_kinds:
    Stadtkreis: STADTKREIS
    Landkreis: LANDKREIS
    Kreis: LANDKREIS
  continued_prefixes: []
  section_header_has_totals: true
  wrapped_label_attach: next
  unit_level_default: GEMEINDE
  required_checks:
  - voters_le_eligible
  - valid_le_voters
  - party_sum_eq_valid
  # whether the printed 'Wahlbeteiligung in vH' follows voters/eligible is decided on the data of each
  # run (definition probe, validation/rules.py); this volume deviates in ~80 % of the rows
  - turnout_consistent
