          - {key: voters, role: metric, metric: voters, value_type: integer, header_aliases: ["Wähler"], integer_format: *int}
          - {key: vote_marker, role: row_marker, value_type: marker, header_aliases: ["Erststimmen - E Zweitstimmen - Z"]}
          - {key: invalid, role: metric, metric: invalid_votes, value_type: integer, header_aliases: ["ungültige"], integer_format: *int}
