# Document profile bound by SHA-256 to data/121_2611_65001.pdf (Statistik von Baden-Wuerttemberg, Band 121:
# "Die Wahl zum fuenften Deutschen Bundestag", 19. September 1965), table 3
# "Endgueltige Ergebnisse der Wahl zum 5. Deutschen Bundestag ... in den Gemeinden", pages 30-300.
# Domain data, NOT code. Created 2026-09-30 (visual inspection), verified: false until checked.
#
# Layout: line-printer output WITHOUT any ruling lines; header closed by the printed column numbers 1-11.
# One unit = 4 lines: ABS/E, ABS/Z (absolute numbers), %/E, %/Z (shares). Kennziffer + name + 'ABS' on the
# first line; Wahlberechtigte and Waehler only on the first line; the turnout is printed in the Waehler
# column of the first %-line. Parties without votes are printed as EMPTY cells (no dash).
# Decisions (docs/decisions.md D6, D7): empty party cell = 0 only with exact party-sum proof; %-lines are a blocking
# cross-check and never published. Names are printed in capitals without umlauts ('GAERTRINGEN').
document_profile_id: bw_btw1965_gemeinden
description: Bundestagswahl 1965, Gemeindeergebnisse Baden-Wuerttemberg (Statistik von Baden-Wuerttemberg, Band 121, Tabelle 3)
sha256:
  - c3d94d636ee8d2e1ac3a4fad27340d5f1d18d585f3d253ee1b470ea295172b92
verified: false
sources:
  - data/121_2611_65001.pdf pages 30-300 (column headers and numbers, row structure; visual inspection 2026-09-30)

x-formats:
  int: &int {thousands_separators: [], dash_means_zero: false}
  idx: &idx {thousands_separators: [], dash_means_zero: false}

tables:
  - table_profile_id: bw65_gemeinde_results
    election_id: btw_1965
    description: Four lines per unit (ABS E, ABS Z, % E, % Z); groups start at the line carrying Kennziffer/name.
    row_mode: marker_group
    line_anchor_column: vote_marker
    anchor_confirmation_column: valid
    marker_column: vote_marker
    marker_sequence: [E, Z, E, Z]
    marker_columns:
      designation: ["*", null, "*", null]     # 'ABS' on the first, '%' on the third line; nothing else
      # E/Z must be printed on every line, but its reading is not required as evidence: the slot of each
      # line is already fixed by the labelled first line, the group size 4, the designation pattern above
      # and the percent format + blocking percent cross-check of lines 3/4 (E/Z glyphs of the printout are
      # read poorly, e.g. EasyOCR 'E' for 'Z' in 1969).
      vote_marker: ["*", "*", "*", "*"]
    group_by: label_start
    formats:
      pct1: {value_type: decimal, decimal_format: {decimal_separator: ",", decimals: 1, min_value: "0", max_value: "100"}}
    roles:
      - role_id: abs_e
        vote_type: ERSTSTIMME
        slot: 0
        fields:
          - {field: eligible_voters, column: eligible, slot: 0}
          - {field: voters, column: voters, slot: 0}
          - &abs_turnout {field: turnout_percent, column: voters, slot: 2, format: pct1}
          - &abs_invalid {field: invalid_votes, column: invalid}
          - &abs_valid {field: valid_votes, column: valid}
          - &abs_cdu {field: "party:cdu", column: party_cdu}
          - &abs_spd {field: "party:spd", column: party_spd}
          - &abs_fdp {field: "party:fdp", column: party_fdp}
          - &abs_aud {field: "party:aud", column: party_aud}
          - &abs_dfu {field: "party:dfu", column: party_dfu}
          - &abs_npd {field: "party:npd", column: party_npd}
          - &abs_fsu {field: "party:fsu", column: party_fsu}
      - role_id: abs_z
        vote_type: ZWEITSTIMME
        slot: 1
        fields:
          - {field: eligible_voters, column: eligible, slot: 0}
          - {field: voters, column: voters, slot: 0}
          - *abs_turnout
          - *abs_invalid
          - *abs_valid
          - *abs_cdu
          - *abs_spd
          - *abs_fdp
          - *abs_aud
          - *abs_dfu
          - *abs_npd
          - *abs_fsu
      - role_id: pct_e
        vote_type: ERSTSTIMME
        slot: 2
        kind: percent
        percent_of: abs_e
        publish: false
        fields:
          - {field: turnout_percent, column: voters, format: pct1}
          - &pct_invalid {field: invalid_votes, column: invalid, format: pct1}
          - &pct_valid {field: valid_votes, column: valid, format: pct1}
          - &pct_cdu {field: "party:cdu", column: party_cdu, format: pct1}
          - &pct_spd {field: "party:spd", column: party_spd, format: pct1}
          - &pct_fdp {field: "party:fdp", column: party_fdp, format: pct1}
          - &pct_aud {field: "party:aud", column: party_aud, format: pct1}
          - &pct_dfu {field: "party:dfu", column: party_dfu, format: pct1}
          - &pct_npd {field: "party:npd", column: party_npd, format: pct1}
          - &pct_fsu {field: "party:fsu", column: party_fsu, format: pct1}
      - role_id: pct_z
        vote_type: ZWEITSTIMME
        slot: 3
        kind: percent
        percent_of: abs_z
        publish: false
        fields: [*pct_invalid, *pct_valid, *pct_cdu, *pct_spd, *pct_fdp, *pct_aud, *pct_dfu, *pct_npd, *pct_fsu]
    # Whether the printed turnout (first %-line, Waehler column; also published with the absolute
    # rows) follows voters/eligible is decided on each run's data (definition probe) - not fixed here.
    percent_definitions:
      turnout_percent: {numerator: voters, denominator: [eligible_voters]}
      invalid_votes: {numerator: invalid_votes, denominator: [invalid_votes, valid_votes]}
      valid_votes: {numerator: valid_votes, denominator: [invalid_votes, valid_votes]}
      "party:*": {numerator: "party:*", denominator: [valid_votes]}
    blank_party_cells_zero_with_sum_proof: true
    # name only (Kennziffer has its own column); trailing leader dots are no part of the name
    label_pattern: '^(?P<name>[^\d\s].*?)(?:[\s.·•,:;''`*«»~-]*)$'
    keyword_precedence: true
    section_index_allowed: true
    section_kinds: {"LKR.": LANDKREIS}
    continued_prefixes: ["NOCH"]
    total_keywords: ["INSGESAMT"]
    structural_headings:
      STADTKREISE: {unit_level: STADTKREIS}
      LANDKREISE: {}
    name_matching: ascii_printout
    wrapped_label_attach: group
    unit_level_default: GEMEINDE
    required_checks: [voters_le_eligible, voters_eq_valid_plus_invalid, party_sum_eq_valid]
    structure: {columns: column_numbers, header_end: column_numbers}
    variants:
      - variant_id: nordwuerttemberg
        pages: "30-108"
        state: Baden-Württemberg
        context: {regierungsbezirk: Nordwürttemberg}
        columns: &columns65
          - {key: kennziffer, role: unit_index, value_type: integer, header_aliases: ["KENNZIFFER"], integer_format: *idx}
          - {key: name, role: unit_label, value_type: label, header_aliases: ["STADTKREIS / LANDKREIS GEMEINDE NAME", "NAME"]}
          - {key: designation, role: row_marker, value_type: marker, header_aliases: ["BEZEICHNUNG"]}
          - {key: eligible, role: metric, metric: eligible_voters, value_type: integer, header_aliases: ["WAHLBERECHTIGTE"], integer_format: *int, column_number: 1}
          - {key: voters, role: metric, metric: voters, value_type: integer, header_aliases: ["WAEHLER"], integer_format: *int, column_number: 2}
          - {key: vote_marker, role: row_marker, value_type: marker, header_aliases: ["ERST-/ ZWEIT- STIMMEN"]}
          - {key: invalid, role: metric, metric: invalid_votes, value_type: integer, header_aliases: ["UNGUELTIGE"], integer_format: *int, column_number: 3}
          - {key: valid, role: metric, metric: valid_votes, value_type: integer, header_aliases: ["GUELTIGE"], integer_format: *int, column_number: 4}
          - {key: party_cdu, role: party, party_id: cdu, value_type: integer, header_aliases: [CDU], integer_format: *int, column_number: 5}
          - {key: party_spd, role: party, party_id: spd, value_type: integer, header_aliases: [SPD], integer_format: *int, column_number: 6}
          - {key: party_fdp, role: party, party_id: fdp, value_type: integer, header_aliases: [FDP], integer_format: *int, column_number: 7}
          - {key: party_aud, role: party, party_id: aud, value_type: integer, header_aliases: [AUD], integer_format: *int, column_number: 8}
          - {key: party_dfu, role: party, party_id: dfu, value_type: integer, header_aliases: [DFU], integer_format: *int, column_number: 9}
          - {key: party_npd, role: party, party_id: npd, value_type: integer, header_aliases: [NPD], integer_format: *int, column_number: 10}
          - {key: party_fsu, role: party, party_id: fsu, value_type: integer, header_aliases: [FSU], integer_format: *int, column_number: 11}
      - variant_id: nordbaden
        pages: "109-147"
        state: Baden-Württemberg
        context: {regierungsbezirk: Nordbaden}
        columns: *columns65
      - variant_id: suedbaden
        pages: "148-225"
        state: Baden-Württemberg
        context: {regierungsbezirk: Südbaden}
        columns: *columns65
      - variant_id: suedwuerttemberg_hohenzollern
        pages: "226-300"
        state: Baden-Württemberg
        context: {regierungsbezirk: Südwürttemberg-Hohenzollern}
        columns: *columns65

  # Table 2 "Endgueltige Ergebnisse der Wahl zum 5. Deutschen Bundestag ... in den Wahlkreisen und
  # Regierungsbezirken Baden-Wuerttembergs", spreads 20/21 ... 28/29 (visual inspection 2026-10-01).
  # Line printer, no rules, header closed by the column numbers 1-21. One constituency = 6 lines:
  #   65 (absolute 1965) / % (shares) / 61 (1961, recomputed for the 1965 constituency) / % / V (change
  #   1965-1961, trailing minus '5973-') / % (relative change in % of 1961, empty where 1961 = 0).
  # Turnout on the first %-line in the Waehler column; Wahlberechtigte and Waehler only once (shared by
  # Erst- and Zweitstimmen). The Wahlkreismandat (party) is printed on the 65 and 61 lines; stars below a
  # value mark the strongest party; '*' before a name marks a changed constituency (not evaluated).
  # Regierungsbezirk totals ('NORDWUERTTEMBERG') and the Land total ('BADEN - WUERTTEMBERG') carry no index.
  # The 61 lines are NOT the official 1961 constituency results (other boundaries): cross-check basis only.
  - table_profile_id: bw65_wahlkreis_results
    election_id: btw_1965
    description: Wahlkreisergebnisse 1965 with 1961 comparison and change lines, Reg.-Bez. and Land totals.
    row_mode: marker_group
    marker_sequence: [j65, p65, j61, p61, v, pv]
    marker_columns:
      year: ["*", "*", "*", "*", "*", "*"]       # '65', '%', '61', '%', 'V', '%'
      mandate: ["?", null, "?", null, null, null]
    group_by: label_start
    line_anchor_column: voters
    anchor_confirmation_column: e_valid
    formats:
      pct1: {value_type: decimal, decimal_format: {decimal_separator: ",", decimals: 1, min_value: "0", max_value: "100"}}
      diff: {value_type: integer, integer_format: {thousands_separators: [], dash_means_zero: false, sign: trailing}}
      chg1: {value_type: decimal, decimal_format: {decimal_separator: ",", decimals: 1, min_value: "0", sign: trailing}}
    roles:
      - role_id: e65
        vote_type: ERSTSTIMME
        slot: 0
        fields:
          - &wk65_elig {field: eligible_voters, column: eligible, slot: 0}
          - &wk65_vot {field: voters, column: voters, slot: 0}
          - &wk65_turn {field: turnout_percent, column: voters, slot: 1, format: pct1}
          - {field: invalid_votes, column: e_invalid}
          - {field: valid_votes, column: e_valid}
          - {field: "party:cdu", column: e_cdu}
          - {field: "party:spd", column: e_spd}
          - {field: "party:fdp", column: e_fdp}
          - {field: "party:aud", column: e_aud}
          - {field: "party:dfu", column: e_dfu}
          - {field: "party:npd", column: e_npd}
          - {field: "party:fsu", column: e_fsu}
          - {field: "party:sonstige", column: e_sonst}
      - role_id: z65
        vote_type: ZWEITSTIMME
        slot: 0
        fields:
          - *wk65_elig
          - *wk65_vot
          - *wk65_turn
          - {field: invalid_votes, column: z_invalid}
          - {field: valid_votes, column: z_valid}
          - {field: "party:cdu", column: z_cdu}
          - {field: "party:spd", column: z_spd}
          - {field: "party:fdp", column: z_fdp}
          - {field: "party:aud", column: z_aud}
          - {field: "party:dfu", column: z_dfu}
          - {field: "party:npd", column: z_npd}
          - {field: "party:sonstige", column: z_sonst}
      - role_id: pe65
        vote_type: ERSTSTIMME
        slot: 1
        kind: percent
        percent_of: e65
        publish: false
        fields: &wk65_pe
          - {field: turnout_percent, column: voters, format: pct1}
          - {field: invalid_votes, column: e_invalid, format: pct1}
          - {field: valid_votes, column: e_valid, format: pct1}
          - {field: "party:cdu", column: e_cdu, format: pct1}
          - {field: "party:spd", column: e_spd, format: pct1}
          - {field: "party:fdp", column: e_fdp, format: pct1}
          - {field: "party:aud", column: e_aud, format: pct1}
          - {field: "party:dfu", column: e_dfu, format: pct1}
          - {field: "party:npd", column: e_npd, format: pct1}
          - {field: "party:fsu", column: e_fsu, format: pct1}
          - {field: "party:sonstige", column: e_sonst, format: pct1}
      - role_id: pz65
        vote_type: ZWEITSTIMME
        slot: 1
        kind: percent
        percent_of: z65
        publish: false
        fields: &wk65_pz
          - {field: invalid_votes, column: z_invalid, format: pct1}
