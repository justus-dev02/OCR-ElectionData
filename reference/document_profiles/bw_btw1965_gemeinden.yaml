      - role_id: ce
        vote_type: ERSTSTIMME
        slot: 5
        kind: change
        change_of: [de, e61]
        publish: false
        fields:
          - {field: eligible_voters, column: eligible, format: chg1}
          - {field: voters, column: voters, format: chg1}
