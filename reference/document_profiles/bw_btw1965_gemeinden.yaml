      - {role_id: pe61, vote_type: ERSTSTIMME, slot: 3, kind: percent, percent_of: e61, publish: false, fields: *wk65_pe}
      - {role_id: pz61, vote_type: ZWEITSTIMME, slot: 3, kind: percent, percent_of: z61, publish: false, fields: *wk65_pz}
      - role_id: de
