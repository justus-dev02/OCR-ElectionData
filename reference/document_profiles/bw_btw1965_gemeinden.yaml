          - {field: voters, column: voters}
          - {field: turnout_percent, column: voters, slot: 3, format: pct1}
          - {field: invalid_votes, column: e_invalid}
          - {field: valid_votes, column: e_valid}
          - {field: "party:cdu", column: e_cdu}
