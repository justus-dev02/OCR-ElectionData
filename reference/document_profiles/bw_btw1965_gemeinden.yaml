        fields: &wk65_z61
          - {field: eligible_voters, column: eligible}
          - {field: voters, column: voters}
          - {field: turnout_percent, column: voters, slot: 3, format: pct1}
          - {field: invalid_votes, column: z_invalid}
          - {field: valid_votes, column: z_valid}
          - {field: "party:cdu", column: z_cdu}
