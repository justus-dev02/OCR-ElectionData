name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install "ruff==0.6.9" "mypy==1.18.2" types-PyYAML "pydantic>=2.5" "pydantic-settings>=2.2" "sqlalchemy>=2.0" "numpy>=1.26" "pillow>=10" "click>=8.1" "rich>=13"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  tests:
    name: Unit + integration tests (no OCR models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu libtesseract-dev libleptonica-dev pkg-config
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      - name: Reference data must load and cross-validate
        run: election-ocr reference check
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  # The real-page regression (tests -m slow, scripts/regression_snapshot.py) and the
  # validation report need the source PDFs and model weights, which are not redistributed:
  # run them locally (see README, "Reproducing the results").
